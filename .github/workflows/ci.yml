name: cohort-checks

on:
  pull_request:
  push:

permissions: {}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: calculator-contract
        run: |
          python3 -c 'from calculator import add, mul
          assert add(2, 3) == 5, add(2, 3)
          assert mul(3, 4) == 12, mul(3, 4)
          '
