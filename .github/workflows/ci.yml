name: cohort-checks

on:
  pull_request:
  push:

permissions: {}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: unittest-ratios
        run: |
          python3 -m unittest -v test_ratios
      - name: covers-documented-behaviours
        run: |
          python3 -c 'src = open('"'"'test_ratios.py'"'"', encoding='"'"'utf-8'"'"').read()
          missing = [
              n for n in ('"'"'parse_ratio'"'"', '"'"'ratio'"'"', '"'"'ValueError'"'"', '"'"'ZeroDivisionError'"'"')
              if n not in src
          ]
          assert not missing, missing
          '
