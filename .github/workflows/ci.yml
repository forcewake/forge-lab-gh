name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Syntax check all Python files
        run: |
          find . -name '*.py' -not -path './.git/*' | while read f; do
            python3 -m py_compile "$f"
          done
      - name: Import check
        run: |
          for f in $(find . -maxdepth 1 -name '*.py' ! -name 'setup.py' ! -name 'conftest.py'); do
            python3 -c "import importlib.util; spec = importlib.util.spec_from_file_location('m', '$f'); mod = importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)" 2>&1 || true
          done
