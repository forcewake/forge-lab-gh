# Rendered from forcewake/forge templates/github/forge-lane.yml, pinned to the fix branch
# cursor/e2e-runtime-fixes-8a8d @ 5b12927 (PR #395, unmerged) for a forge 1.0 live verification.
name: forge-lane
run-name: 'forge-lane:${{ fromJSON(inputs.dispatch).forge_run_id }}:${{ fromJSON(inputs.dispatch).attempt }}:${{ fromJSON(inputs.dispatch).generation }}:${{ fromJSON(inputs.dispatch).nonce }}'
on:
  workflow_dispatch:
    inputs:
      dispatch:
        required: true
        type: string
      requirements_url:
        required: true
        type: string
      requirements_sha256:
        required: true
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  lane:
    uses: forcewake/forge/.github/workflows/lane.yml@5b12927f526fe43e3bcf6e7d0a096ef3aa14acae
    with:
      dispatch: ${{ inputs.dispatch }}
      requirements_url: ${{ inputs.requirements_url }}
      requirements_sha256: ${{ inputs.requirements_sha256 }}
    secrets:
      copilot_token: ${{ secrets.FORGE_COPILOT_TOKEN }}
